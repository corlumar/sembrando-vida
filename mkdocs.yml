# ERP Core

## Plataforma empresarial modular

**ERP Core** es una plataforma empresarial modular diseñada para integrar procesos, información, usuarios, servicios y reglas de negocio dentro de una arquitectura común.

El proyecto busca transformar una aplicación originalmente orientada a la operación de Sembrando Vida en un núcleo empresarial reutilizable, extensible y gobernado mediante principios formales de arquitectura de software.

---

## Propósito de esta documentación

Este portal constituye la fuente oficial de conocimiento técnico y funcional del ERP Core.

Aquí se documentan:

- la arquitectura empresarial;
- la arquitectura de software;
- los procesos de negocio;
- el modelo de datos;
- la seguridad;
- los estándares de desarrollo;
- la operación de la plataforma;
- las decisiones arquitectónicas;
- los manuales técnicos y funcionales.

!!! info "Documentación viva"

    La documentación evoluciona junto con el código fuente.  
    Cada modificación relevante deberá quedar registrada mediante Git.

